site_name: "MrJulsen's Mods Wiki"
site_description: "Wiki hosting pages about all of MrJulsen's mods"
site_url: https://wiki.mrjulsen.net/

repo_url: https://github.com/Andre601/mrjulsen-wiki
repo_name: Andre601/mrjulsen-wiki

theme:
  name: material
  custom_dir: theme
  palette:
    scheme: slate
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.instant.preview
    - content.tooltips
    - content.footnote.tooltips
  icon:
    admonition:
      note: octicons/pencil-24
      abstract: octicons/checklist-24
      info: octicons/info-24
      tip: octicons/thumbsup-24
      success: octicons/check-24
      question: octicons/question-24
      warning: octicons/alert-24
      failure: octicons/x-circle-24
      danger: octicons/zap-24
      bug: octicons/bug-24
      example: octicons/beaker-24
      quote: octicons/quote-24

extra_css:
  - assets/stylesheets/tooltip.css
  - assets/stylesheets/style.css
  - assets/stylesheets/admonitions.css
  - assets/stylesheets/advancements.css

extra_javascript:
  - assets/js/tooltip.js

plugins:
  - search
  #- meta
  - categories:
      category_separator: '/'
      verbose: true
      disable_categories_section: true
  - glightbox:
      skip_classes:
        - arrow
        - shapeless
        - fire
        - no-glight
  - macros:
      module_name: macros/macros
  - redirects:
      redirect_maps:
        # Create Railways Navigator
        'createrailwaysnavigator/blocks/advanced_display.md': 'createrailwaysnavigator/blocks/advanced_displays.md'
        'createrailwaysnavigator/blocks/advanced_display_block.md': 'createrailwaysnavigator/blocks/advanced_displays.md'
        'createrailwaysnavigator/blocks/advanced_display_half_panel.md': 'createrailwaysnavigator/blocks/advanced_displays.md'
        'createrailwaysnavigator/blocks/advanced_display_panel.md': 'createrailwaysnavigator/blocks/advanced_displays.md'
        'createrailwaysnavigator/blocks/advanced_display_slab.md': 'createrailwaysnavigator/blocks/advanced_displays.md'
        'createrailwaysnavigator/blocks/advanced_display_small.md': 'createrailwaysnavigator/blocks/advanced_displays.md'
        'createrailwaysnavigator/blocks/advanced_sloped.md': 'createrailwaysnavigator/blocks/advanced_displays.md'
        # TrafficCraft
        'trafficcraft/blocks/asphalt_curb.md': 'trafficcraft/blocks/asphalt.md'
        'trafficcraft/blocks/asphalt_curb_slope.md': 'trafficcraft/blocks/asphalt_slope.md'
        'trafficcraft/blocks/concrete_curb.md': 'trafficcraft/blocks/concrete.md'
        'trafficcraft/blocks/concrete_curb_slope.md': 'trafficcraft/blocks/concrete_slope.md'
        'trafficcraft/blocks/house_number_sign.md': 'trafficcraft/blocks/signs.md'
        'trafficcraft/blocks/manhole_cover.md': 'trafficcraft/blocks/manhole.md'
        'trafficcraft/blocks/red_delineator.md': 'trafficcraft/blocks/delineators.md'
        'trafficcraft/blocks/reflector.md': 'trafficcraft/blocks/delineators.md'
        'trafficcraft/blocks/road_barrier_fence.md': 'trafficcraft/blocks/traffic_blocks.md'
        'trafficcraft/blocks/road_gully.md': 'trafficcraft/blocks/manhole.md'
        'trafficcraft/blocks/small_white_delineator.md': 'trafficcraft/blocks/delineators.md'
        'trafficcraft/blocks/small_yellow_delineator.md': 'trafficcraft/blocks/delineators.md'
        'trafficcraft/blocks/street_sign.md': 'trafficcraft/blocks/signs.md'
        'trafficcraft/blocks/town_sign.md': 'trafficcraft/blocks/signs.md'
        'trafficcraft/blocks/traffic_cone.md': 'trafficcraft/blocks/traffic_blocks.md'
        'trafficcraft/blocks/traffic_bollard.md': 'trafficcraft/blocks/traffic_blocks.md'
        'trafficcraft/blocks/traffic_barrel.md': 'trafficcraft/blocks/traffic_blocks.md'
        'trafficcraft/blocks/traffic_sign.md': 'trafficcraft/blocks/signs.md'
        'trafficcraft/blocks/white_delineator.md': 'trafficcraft/blocks/delineators.md'
        'trafficcraft/blocks/yellow_delineator.md': 'trafficcraft/blocks/delineators.md'

markdown_extensions:
  - attr_list:
  - toc:
      permalink: true
  - footnotes:
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
  - pymdownx.magiclink:
  - pymdownx.superfences:
  - pymdownx.tilde:
  - pymdownx.snippets:
      base_path:
        - 'docs/assets/snippets/'
  - pymdownx.blocks.admonition:
      types:
        - note
        - abstract
        - info
        - tip
        - success
        - question
        - warning
        - failure
        - danger
        - bug
        - example
        - quote
        - redirect
        - category
        - options
  - pymdownx.blocks.details:
  - pymdownx.blocks.tab:
      alternate_style: true
  - pymdownx.blocks.html:
  - pymdownx.blocks.caption:

hooks:
  - hooks/wikilinks.py

validation:
  links:
    absolute_links: relative_to_docs

extra:
  interwiki:
    'mc': 'https://minecraft.wiki/w/{page}'
    'c': 'https://create.fandom.com/wiki/{page}'

not_in_nav: |
  /assets/**/*.md

nav:
  - Home:
    - index.md
    - contribute.md
    - Categories:
      - categories/index.md
      - TrafficCraft:
        - TrafficCraft: categories/trafficcraft.md
        - Paintable: categories/trafficcraft-paintable.md
        - Wrenchable: categories/trafficcraft-wrenchable.md
      - Create Railways Navigator:
        - Create Railways Navigator: categories/create-railways-navigator.md
  - Create Railways Navigator:
    - createrailwaysnavigator/index.md
    - createrailwaysnavigator/train_schedule_features.md
    - Blocks:
      - createrailwaysnavigator/blocks/advanced_displays.md
      - createrailwaysnavigator/blocks/train_station_clock.md
    - Items:
      - createrailwaysnavigator/items/navigator.md
  - TrafficCraft:
    - trafficcraft/index.md
    - Blocks:
      - trafficcraft/blocks/asphalt.md
      - trafficcraft/blocks/asphalt_slope.md
      - trafficcraft/blocks/bitumen_block.md
      - trafficcraft/blocks/bitumen_ore.md
      - trafficcraft/blocks/concrete.md
      - trafficcraft/blocks/concrete_barrier.md
      - trafficcraft/blocks/concrete_slope.md
      - trafficcraft/blocks/delineators.md
      - trafficcraft/blocks/guardrail.md
      - trafficcraft/blocks/manhole.md
      - trafficcraft/blocks/paint_bucket.md
      - trafficcraft/blocks/salt.md
      - trafficcraft/blocks/signs.md
      - trafficcraft/blocks/street_lamps.md
      - trafficcraft/blocks/traffic_blocks.md
      - trafficcraft/blocks/traffic_light.md
      - trafficcraft/blocks/traffic_light_controller.md
      - trafficcraft/blocks/traffic_light_request_button.md
      - trafficcraft/blocks/traffic_sign_post.md
      - trafficcraft/blocks/traffic_sign_workbench.md
    - Items:
      - trafficcraft/items/color_palette.md
      - trafficcraft/items/hammer.md
      - trafficcraft/items/iron_plate.md
      - trafficcraft/items/iron_rod.md
      - trafficcraft/items/paint_brush.md
      - trafficcraft/items/pattern_catalogue.md
      - trafficcraft/items/raw_bitumen.md
      - trafficcraft/items/road_construction_tool.md
      - trafficcraft/items/road_salt.md
      - trafficcraft/items/street_lamp_config_card.md
      - trafficcraft/items/traffic_light_linker.md
      - trafficcraft/items/wrench.md
